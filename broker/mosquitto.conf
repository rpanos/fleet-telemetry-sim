# LOCAL DEVELOPMENT ONLY: no TLS, no authentication.
# Production would use TLS on 8883 + a per-device X.509 certificate.
# Deferred on purpose — see docs/decisions.md (D-101).
listener 1883
allow_anonymous true

# Keep queued QoS 1 messages for disconnected persistent sessions across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
