# Fleet telemetry simulator — local stack.
# M0: MQTT broker. M1: simulated fleet. Later: TimescaleDB, Grafana,
# the ingest worker and the command service.
services:
  broker:
    image: eclipse-mosquitto:2
    container_name: fleet-broker
    ports:
      - "1883:1883"          # MQTT (plain, local only)
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data

  sim:
    build: ./sim
    container_name: fleet-sim
    environment:
      MQTT_HOST: broker
      FLEET_SIZE: "12"
      SEED: "42"
      PUBLISH_EVERY_S: "10"
      KEEPALIVE_S: "15"
    depends_on:
      - broker
    stop_grace_period: 10s   # time to send a clean "offline" for every trailer

volumes:
  broker-data:
