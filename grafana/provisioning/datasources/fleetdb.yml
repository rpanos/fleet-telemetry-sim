apiVersion: 1
datasources:
  - name: FleetDB
    uid: fleetdb
    type: grafana-postgresql-datasource
    url: timescaledb:5432
    user: grafana_ro          # read-only role created in db/001-schema.sql
    isDefault: true
    jsonData:
      database: fleet
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    secureJsonData:
      password: grafana_ro
